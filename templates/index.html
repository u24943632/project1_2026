<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Project Dashboard</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="app">
            <aside class="sidebar">
                <div class="brand">
                    <div class="logo">BFB</div>
                    <h1 class="product">Project Dashboard</h1>
                </div>
                <nav class="nav">
                    <a class="nav-item active" href="#">Overview</a>
                    <a class="nav-item" href="#metrics">Metrics</a>
                    <a class="nav-item" href="contact.html">Contact</a>
                </nav>
                <div class="sidebar-footer">© 2026 BFB</div>
            </aside>

            <div class="main">
                <header class="topbar">
                    <div class="search">
                        <input type="search" placeholder="Search..." aria-label="Search" />
                    </div>
                    <div class="topbar-actions">
                        <button class="btn ghost">New</button>
                        <div class="profile">JD</div>
                    </div>
                </header>

                <main class="content">
                    <section class="overview">
                        <div class="cards">
                            <article class="card">
                                <h3>Active Users</h3>
                                <p class="stat">1,254</p>
                            </article>
                            <article class="card">
                                <h3>Revenue</h3>
                                <p class="stat">$12,430</p>
                            </article>
                            <article class="card">
                                <h3>Errors</h3>
                                <p class="stat">3</p>
                            </article>
                        </div>
                    </section>

                    <section class="grid">
                        <div class="card chart" id="chart">
                            <h4>Performance</h4>
                            <div class="placeholder">[Chart placeholder]</div>
                        </div>

                        <div class="card table">
                            <h4>Recent Activity</h4>
                            <table>
                                <thead>
                                    <tr><th>Time</th><th>User</th><th>Action</th></tr>
                                </thead>
                                <tbody>
                                    <tr><td>09:12</td><td>Duan</td><td>Deployed</td></tr>
                                    <tr><td>08:55</td><td>Keenan</td><td>Updated</td></tr>
                                    <tr><td>08:30</td><td>Sheldon</td><td>Created</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </main>

                <footer class="footer">Built with care — BFB</footer>
            </div>
        </div>
    </body>
</html>
